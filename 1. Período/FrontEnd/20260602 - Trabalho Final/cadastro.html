<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="./css/style.css" rel="stylesheet"></link>
    <link href="./css/navbar.css" rel="stylesheet"></link>
</head>
<body>
    <header>
        <h1>Cadastro Alunos</h1>
        <h3>Voltar Menu</h3>
        <div class="navbar">
            <p id="inicio" class="nav-item">Inicio</p>
            <p id="cadastro" class="nav-item" href="cadastro.html">Cadastro de Alunos</p>
            <p id="notas" class="nav-item" href="notas.html">Notas</p>
            <p id="relatorios" class="nav-item" href="relatorios.html">Relatórios</p>
            <p id="sobre" class="nav-item" href="sobre">sobre</p>
        </div>
    </header>

    <div class="container">
        <div class="box-cadastro card">
            <h2 class="titulo">Novo Aluno</h2>
            <div class="inputs">
                <div class="campo">
                    <label for="nome-aluno">Nome</label>
                    <input type="text" id="nome-aluno">
                </div>

                <div class="campo">
                    <label for="cursos">Curso</label>
                    <select name="" id="cursos">
                        <option value="">Selecione um curso</option>
                        <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                        <option value="eng-software">Engenharia de Software</option>
                        <option value="ciencia-comp">Ciência da Computação</option>
                        <option value="sistemas-info">Sistemas de Informação</option>
                        <option value="eng-computacao">Engenharia da Computação</option>
                        <option value="redes">Redes de Computadores</option>
                        <option value="seguranca">Segurança da Informação</option>
                        <option value="banco-dados">Banco de Dados</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="semestre">Semestre</label>
                    <input type="number" id="semetre">
                </div>

                <div class="campo">
                    <label for="nascimento">Data de Nascimento</label>
                    <input type="date" id="nascimento">
                </div>
            </div>
            <button>Cadastrar Aluno</button>
        </div>
    </div>

    <script src="js/navbar.js"></script>
</body>
</html>
